[package]
name = "apollolauncher"
version = "0.1.0"
edition = "2024"

[dependencies]
directories = "6.0.0"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "x11"] }
image = { version = "0.25.10", default-features = false, features = ["png", "ico", "jpeg", "bmp", "gif", "webp", "tiff"] }
notify = "8.2.1"
rfd = { version = "0.17.2", default-features = true }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
unicode-normalization = "0.1.26"
walkdir = "2.5.0"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_Security"] }

[build-dependencies]
winresource = "0.1.34"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2
